apiVersion: apps/v1
kind: Deployment
metadata:
  name: dco-frontend
  namespace: dco-cms
  labels:
    app: dco-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dco-frontend
  template:
    metadata:
      labels:
        app: dco-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: IMAGE_FRONTEND_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
      imagePullSecrets:
        - name: cdso-registry-secret
