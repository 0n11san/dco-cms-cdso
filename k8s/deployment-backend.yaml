apiVersion: apps/v1
kind: Deployment
metadata:
  name: dco-backend
  namespace: dco-cms
  labels:
    app: dco-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dco-backend
  template:
    metadata:
      labels:
        app: dco-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: IMAGE_BACKEND_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: dco-cms-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dco-cms-secrets
                  key: DB_PASSWORD
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: dco-cms-secrets
                  key: SESSION_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: cdso-registry-secret
