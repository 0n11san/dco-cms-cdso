# GN uses the Istio ingress gateway — adjust annotations if your cluster uses nginx-ingress instead
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dco-cms-ingress
  namespace: dco-cms
  annotations:
    kubernetes.io/ingress.class: "istio"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - dco-cms.apps.gabriel-nimbus.mil
      secretName: dco-cms-tls
  rules:
    - host: dco-cms.apps.gabriel-nimbus.mil
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dco-backend-svc
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dco-frontend-svc
                port:
                  number: 80
