# DO NOT commit real values here.
# In cDSO/GN, populate these via GitLab CI/CD masked variables or a Vault integration.
# Values below are base64-encoded placeholders — replace before applying.
#
# To encode:  echo -n 'your-value' | base64
# To decode:  echo 'base64string' | base64 -d

apiVersion: v1
kind: Secret
metadata:
  name: dco-cms-secrets
  namespace: dco-cms
type: Opaque
data:
  DB_PASSWORD:    REPLACE_WITH_BASE64_ENCODED_PASSWORD
  SESSION_SECRET: REPLACE_WITH_BASE64_ENCODED_SESSION_SECRET
